name: Android private APK from URL

on:
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "Direct HTTPS URL (port 443) to a ZIP of your installed PC game; do not include passwords or secret tokens"
        required: true
        type: string
      target_abi:
        description: "CPU ABI to build"
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
  workflow_call:
    inputs:
      game_zip_url:
        description: "Direct HTTPS URL (port 443) to a ZIP of your installed PC game; do not include passwords or secret tokens"
        required: true
        type: string
      target_abi:
        description: "CPU ABI to build (armeabi-v7a or arm64-v8a)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-private-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: android-35
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: 8.11.1
  AGP_VERSION: 8.9.2

jobs:
  build-private-apk:
    name: Build private APK with embedded code/image (${{ inputs.target_abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_ABI: ${{ inputs.target_abi }}

    steps:
      - name: Require a private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$PRIVATE" != "true" ]; then
            echo "::error::The embedded APK contains game-derived code and image.bin. GitHub Actions artifacts in a public repository are public. Make the repository private, or build locally with tools/android/build_private_apk.py."
            exit 1
          fi
          echo "Private repository confirmed; the source URL will not be printed."

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install translator dependencies
        run: python -m pip install -r tools/vita_code/requirements.txt

      - name: Host tests
        run: |
          python -m py_compile \
            tools/android/fetch_deps.py \
            tools/android/fetch_game_zip.py \
            tools/android/embedded_game.py \
            tools/android/build_private_apk.py \
            tools/android/verify_apk.py \
            tools/android/verify_game_pack.py \
            tools/android/test_android.py \
            tools/android/test_game_zip.py \
            tools/android/test_embedded.py \
            tools/make_android_files.py
          python tools/android/test_android.py
          python tools/android/test_game_zip.py
          python tools/android/test_embedded.py
          mkdir -p build/ci
          cc -std=c11 -Wall -Wextra -Werror -I. tools/android/test_touch.c rt/android/touch.c -o build/ci/test_touch
          ./build/ci/test_touch

      - name: Fetch pinned native sources
        run: python tools/android/fetch_deps.py

      - name: Download and extract the user-supplied game ZIP
        env:
          GAME_ZIP_URL: ${{ inputs.game_zip_url }}
        run: |
          python tools/android/fetch_game_zip.py --work-dir build/android-game-source
          rm -f build/android-game-source/source.zip

      - name: Build private APK with embedded code and image
        run: |
          GAME_DIR="$(python -c 'import json; from pathlib import Path; r=json.loads(Path("build/android-game-source/report.json").read_text()); print(Path("build/android-game-source/game") / r["game_dir"])')"
          mkdir -p build/android-private-artifacts
          python tools/android/build_private_apk.py "$GAME_DIR" build/android-private-artifacts/TMNT-2003-private.apk \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION" \
            --abi "$TARGET_ABI"

      - name: Verify the private APK
        run: |
          python tools/android/verify_apk.py build/android-private-artifacts/TMNT-2003-private.apk \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Stage private artifact and build information
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path("build/android-private-artifacts")
          apk = out / "TMNT-2003-private.apk"
          report = json.loads(Path("build/android-game-source/report.json").read_text(encoding="utf-8"))

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          checksum = sha256(apk)
          (out / "SHA256SUMS.txt").write_text(f"{checksum}  {apk.name}\n", encoding="utf-8")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          info = [
              "PRIVATE game-derived APK. Do not publish or share this artifact.",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Run: {run_url}",
              f"Source ZIP SHA-256: {report['archive_sha256']}",
              f"Supported EXE SHA-1: {report['exe_sha1']}",
              f"ABI: {os.environ['TARGET_ABI']}",
              f"APK SHA-256: {checksum}",
              "",
              "The APK embeds libtmnt_code.so and image.bin. Install it, then import a ZIP or folder of the same installed PC game.",
          ]
          (out / "BUILD-INFO.txt").write_text("\n".join(info) + "\n", encoding="utf-8")
          (out / "README-IMPORT.txt").write_text(
              "Установите TMNT-2003-private.apk. В лаунчере импортируйте ZIP или папку той же установленной PC-игры.\n"
              "Код и image.bin уже встроены; пакет .tmnt.zip не нужен. APK приватный: не публикуйте его.\n",
              encoding="utf-8",
          )
          PY

      - name: Remove raw game and game-derived intermediates
        if: always()
        run: |
          rm -rf build/android-game-source/game build/android-game-source/source.zip recomp/out \
            build/android-private-game build/android-private-app build/ci/apk-lib

      - name: Upload private APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TMNT-2003-private-apk-${{ inputs.target_abi }}-PRIVATE
          path: |
            build/android-private-artifacts/TMNT-2003-private.apk
            build/android-private-artifacts/SHA256SUMS.txt
            build/android-private-artifacts/BUILD-INFO.txt
            build/android-private-artifacts/README-IMPORT.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
