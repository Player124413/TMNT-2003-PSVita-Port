name: Android embedded APK from URL

on:
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "HTTPS ZIP of the installed PC game (EXE + data). Leave empty when using exe_url."
        required: false
        default: ""
        type: string
      exe_url:
        description: "HTTPS URL to TMNT_EN.EXE only (~2.15 MiB), or a ZIP containing only that EXE; media is imported on the phone later"
        required: false
        default: ""
        type: string
      target_abi:
        description: "CPU ABI to build"
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
      confirm_public_artifact:
        description: "Public repositories only: I understand the embedded APK (game-derived code + image.bin) will be PUBLICLY downloadable"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      game_zip_url:
        description: "HTTPS ZIP of the installed PC game (EXE + data); mutually exclusive with exe_url"
        required: false
        type: string
      exe_url:
        description: "HTTPS URL to TMNT_EN.EXE only, or a ZIP containing only that EXE; mutually exclusive with game_zip_url"
        required: false
        type: string
      target_abi:
        description: "CPU ABI to build (armeabi-v7a or arm64-v8a)"
        required: true
        type: string
      confirm_public_artifact:
        description: "Public repositories only: acknowledge that the embedded APK artifact will be public"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-embedded-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: android-35
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: 8.11.1
  AGP_VERSION: 8.9.2

jobs:
  build-embedded-apk:
    name: Build embedded APK with code/image (${{ inputs.target_abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_ABI: ${{ inputs.target_abi }}

    steps:
      - name: Require a private repository or explicit public confirmation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PUBLIC_ARTIFACT: ${{ inputs.confirm_public_artifact }}
        run: |
          PRIVATE="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$PRIVATE" = "true" ]; then
            echo "visibility=PRIVATE" >> "$GITHUB_OUTPUT"
            echo "Private repository confirmed; the artifact is access-controlled."
          elif [ "$CONFIRM_PUBLIC_ARTIFACT" = "true" ]; then
            echo "visibility=PUBLIC" >> "$GITHUB_OUTPUT"
            echo "::warning::This repository is PUBLIC and confirm_public_artifact=true. The embedded APK contains game-derived code (tmnt_code.so) and image.bin and will be PUBLICLY downloadable. Only do this if you have the right to redistribute those files. No full media data (.DAT/.afs) is embedded."
          else
            echo "::error::The embedded APK contains game-derived code and image.bin. In a public repository its Actions artifact is public. Make the repository private, or re-run with confirm_public_artifact=true to accept public visibility, or build locally with tools/android/build_private_apk.py."
            exit 1
          fi
          echo "The source URL will not be printed."

      - name: Select exactly one build source
        env:
          GAME_ZIP_URL: ${{ inputs.game_zip_url }}
          EXE_URL: ${{ inputs.exe_url }}
        run: |
          python3 - <<'PY'
          import os
          game = bool(os.environ.get("GAME_ZIP_URL", "").strip())
          exe = bool(os.environ.get("EXE_URL", "").strip())
          if game == exe:
              raise SystemExit("::error::Fill exactly one source: game_zip_url or exe_url.")
          print("Build source:", "EXE-only" if exe else "full game ZIP")
          PY

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install translator dependencies
        run: python -m pip install -r tools/vita_code/requirements.txt

      - name: Host tests
        run: |
          python -m py_compile \
            tools/android/fetch_deps.py \
            tools/android/fetch_game_zip.py \
            tools/android/embedded_game.py \
            tools/android/build_private_apk.py \
            tools/android/verify_apk.py \
            tools/android/verify_game_pack.py \
            tools/android/test_android.py \
            tools/android/test_game_zip.py \
            tools/android/test_embedded.py \
            tools/make_android_files.py
          python tools/android/test_android.py
          python tools/android/test_game_zip.py
          python tools/android/test_embedded.py
          mkdir -p build/ci
          cc -std=c11 -Wall -Wextra -Werror -I. tools/android/test_touch.c rt/android/touch.c -o build/ci/test_touch
          ./build/ci/test_touch

      - name: Fetch pinned native sources
        run: python tools/android/fetch_deps.py

      - name: Download and validate the user-supplied build source
        env:
          GAME_ZIP_URL: ${{ inputs.game_zip_url }}
          EXE_URL: ${{ inputs.exe_url }}
        run: |
          if [ -n "${EXE_URL// /}" ]; then
            python tools/android/fetch_game_zip.py --exe-only --url-env EXE_URL --work-dir build/android-game-source \
              --max-download-mib 8 --max-expanded-mib 8 --max-entries 100 --timeout-seconds 300
          else
            python tools/android/fetch_game_zip.py --work-dir build/android-game-source
          fi
          rm -f build/android-game-source/source.zip

      - name: Build embedded APK with code and image
        run: |
          GAME_DIR="$(python -c 'import json; from pathlib import Path; r=json.loads(Path("build/android-game-source/report.json").read_text()); print(Path("build/android-game-source/game") / r["game_dir"])')"
          mkdir -p build/android-embedded-artifacts
          DATA_VALIDATED="$(python -c 'import json; from pathlib import Path; r=json.loads(Path("build/android-game-source/report.json").read_text()); print("true" if r.get("data_validated", True) else "false")')"
          ARGS=()
          if [ "$DATA_VALIDATED" = "false" ]; then ARGS+=(--exe-only); fi
          python tools/android/build_private_apk.py "$GAME_DIR" build/android-embedded-artifacts/TMNT-2003-embedded.apk \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION" \
            --abi "$TARGET_ABI" "${ARGS[@]}"

      - name: Verify the embedded APK
        run: |
          python tools/android/verify_apk.py build/android-embedded-artifacts/TMNT-2003-embedded.apk \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Stage embedded artifact and build information
        env:
          VISIBILITY: ${{ steps.gate.outputs.visibility }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path("build/android-embedded-artifacts")
          apk = out / "TMNT-2003-embedded.apk"
          report = json.loads(Path("build/android-game-source/report.json").read_text(encoding="utf-8"))
          visibility = os.environ["VISIBILITY"]
          source_kind = report.get("source_kind", "zip")
          source_hash = report.get("source_sha256") or report["archive_sha256"]
          data_validation = "sha256" if report.get("data_validated", True) else "on-import"

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          checksum = sha256(apk)
          (out / "SHA256SUMS.txt").write_text(f"{checksum}  {apk.name}\n", encoding="utf-8")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          if visibility == "PUBLIC":
              header = ("PUBLIC game-derived embedded APK (tmnt_code.so + image.bin only; no full media data). "
                        "It is publicly downloadable. Only redistribute it if you have the right to do so.")
              readme_note = ("Этот APK содержит производные от игры код и image.bin и доступен публично; "
                             "распространяйте его только если у вас есть такое право.\n")
          else:
              header = "PRIVATE game-derived embedded APK. Do not publish or share this artifact."
              readme_note = "APK приватный: не публикуйте его.\n"
          if data_validation == "on-import":
              readme_note += ("Сборка получила только EXE: хеши .DAT/.afs не зашивались. Лаунчер проверит состав/лимиты и запишет SHA-256 при импорте; используйте данные той же версии игры.\n")
          info = [
              header,
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Run: {run_url}",
              f"Source kind: {source_kind}",
              f"Source SHA-256: {source_hash}",
              f"Data validation: {data_validation}",
              f"Supported EXE SHA-1: {report['exe_sha1']}",
              f"ABI: {os.environ['TARGET_ABI']}",
              f"APK SHA-256: {checksum}",
              "",
              "The APK embeds libtmnt_code.so and image.bin. Install it, then import a ZIP or folder of the same installed PC game.",
          ]
          (out / "BUILD-INFO.txt").write_text("\n".join(info) + "\n", encoding="utf-8")
          (out / "README-IMPORT.txt").write_text(
              "Установите TMNT-2003-embedded.apk. В лаунчере импортируйте ZIP или папку той же установленной PC-игры.\n"
              "Код и image.bin уже встроены; пакет .tmnt.zip не нужен. Полные игровые данные (.DAT/.afs) в APK не входят.\n"
              + readme_note,
              encoding="utf-8",
          )
          PY

      - name: Remove raw game and game-derived intermediates
        if: always()
        run: |
          rm -rf build/android-game-source/game build/android-game-source/source.zip recomp/out \
            build/android-private-game build/android-private-app build/ci/apk-lib

      - name: Upload embedded APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TMNT-2003-embedded-apk-${{ inputs.target_abi }}-${{ steps.gate.outputs.visibility }}
          path: |
            build/android-embedded-artifacts/TMNT-2003-embedded.apk
            build/android-embedded-artifacts/SHA256SUMS.txt
            build/android-embedded-artifacts/BUILD-INFO.txt
            build/android-embedded-artifacts/README-IMPORT.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
