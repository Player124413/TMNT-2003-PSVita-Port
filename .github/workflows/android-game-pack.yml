name: Android game pack from URL

on:
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "Direct HTTPS URL (port 443) to a ZIP of your installed PC game; do not include passwords or secret tokens"
        required: true
        type: string
      confirm_public_artifact:
        description: "I understand that the game-derived artifact will be PUBLIC in this public repository"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      game_zip_url:
        description: "Direct HTTPS URL (port 443) to a ZIP of your installed PC game; do not include passwords or secret tokens"
        required: true
        type: string
      confirm_public_artifact:
        description: "I understand that the game-derived artifact will be PUBLIC in this public repository"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-game-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_ABI: armeabi-v7a
  ANDROID_PLATFORM: android-35
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: 8.11.1
  AGP_VERSION: 8.9.2

jobs:
  build-game-pack:
    name: Build matching APK, recompile game, verify pack
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Require public-artifact confirmation
        env:
          CONFIRM_PUBLIC_ARTIFACT: ${{ inputs.confirm_public_artifact }}
        run: |
          if [ "$CONFIRM_PUBLIC_ARTIFACT" != "true" ]; then
            echo "::error::This repository is public. Re-run with confirm_public_artifact=true only if you accept that game-derived artifacts will be publicly downloadable. For private output, make the repository private or use tools/make_android_files.py locally."
            exit 1
          fi
          echo "Public game-derived artifact acknowledged; the source URL will not be printed."

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install translator dependencies
        run: python -m pip install -r tools/vita_code/requirements.txt

      - name: Host tests
        run: |
          python -m py_compile \
            tools/android/fetch_deps.py \
            tools/android/fetch_game_zip.py \
            tools/android/embedded_game.py \
            tools/android/build_private_apk.py \
            tools/android/verify_apk.py \
            tools/android/verify_game_pack.py \
            tools/android/test_android.py \
            tools/android/test_game_zip.py \
            tools/android/test_embedded.py \
            tools/make_android_files.py
          python tools/android/test_android.py
          python tools/android/test_game_zip.py
          python tools/android/test_embedded.py
          mkdir -p build/ci
          cc -std=c11 -Wall -Wextra -Werror -I. tools/android/test_touch.c rt/android/touch.c -o build/ci/test_touch
          ./build/ci/test_touch

      - name: Fetch pinned native sources
        run: python tools/android/fetch_deps.py

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and exercise game-pack ABI without game data
        run: python tools/android/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Stage matching APK and runtime
        run: |
          mkdir -p build/ci-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build/ci-artifacts/TMNT-2003-android-debug.apk
          cp build/android-runtime/armeabi-v7a/libtmnt_runtime.so build/ci-artifacts/libtmnt_runtime.so
          (cd build/ci-artifacts && sha256sum TMNT-2003-android-debug.apk libtmnt_runtime.so > SHA256SUMS.txt)

      - name: Upload installable APK and matching runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TMNT-2003-android-debug-apk
          path: |
            build/ci-artifacts/TMNT-2003-android-debug.apk
            build/ci-artifacts/libtmnt_runtime.so
            build/ci-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Download and extract the user-supplied game ZIP
        env:
          GAME_ZIP_URL: ${{ inputs.game_zip_url }}
        run: |
          python tools/android/fetch_game_zip.py --work-dir build/android-game-source
          # The report keeps the archive hash; the raw ZIP is no longer needed and frees disk space.
          rm -f build/android-game-source/source.zip

      - name: Recompile game code and build the importable pack
        run: |
          rm -rf recomp/out
          GAME_DIR="$(python -c 'import json; from pathlib import Path; r=json.loads(Path("build/android-game-source/report.json").read_text()); print(Path("build/android-game-source/game") / r["game_dir"])')"
          mkdir -p build/android-game-artifacts
          python tools/make_android_files.py "$GAME_DIR" build/android-game-artifacts/TMNT.tmnt.zip \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION" \
            --runtime build/android-runtime/armeabi-v7a/libtmnt_runtime.so

      - name: Verify the generated game pack
        run: |
          python tools/android/verify_game_pack.py build/android-game-artifacts/TMNT.tmnt.zip \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Stage game-pack artifact and build information
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import zipfile

          out = Path("build/android-game-artifacts")
          report = json.loads(Path("build/android-game-source/report.json").read_text(encoding="utf-8"))
          with zipfile.ZipFile(out / "TMNT.tmnt.zip") as archive:
              for name in ("tmnt_code.so", "image.bin"):
                  with archive.open(name) as src, (out / name).open("wb") as dst:
                      shutil.copyfileobj(src, dst, 1 << 20)

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          names = ("TMNT.tmnt.zip", "tmnt_code.so", "image.bin")
          (out / "SHA256SUMS.txt").write_text(
              "".join(f"{sha256(out / name)}  {name}\n" for name in names), encoding="utf-8"
          )
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          info = [
              "PUBLIC game-derived artifact. Do not use this workflow for copies you are not allowed to redistribute.",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Run: {run_url}",
              f"Source ZIP SHA-256: {report['archive_sha256']}",
              f"Supported EXE SHA-1: {report['exe_sha1']}",
              f"TMNT.tmnt.zip SHA-256: {sha256(out / 'TMNT.tmnt.zip')}",
              f"tmnt_code.so SHA-256: {sha256(out / 'tmnt_code.so')}",
              f"image.bin SHA-256: {sha256(out / 'image.bin')}",
              f"APK SHA-256: {sha256(Path('build/ci-artifacts/TMNT-2003-android-debug.apk'))}",
              f"Runtime SHA-256: {sha256(Path('build/ci-artifacts/libtmnt_runtime.so'))}",
              "",
              "Import TMNT.tmnt.zip with the Android launcher. The standalone tmnt_code.so is not an importable pack.",
          ]
          (out / "BUILD-INFO.txt").write_text("\n".join(info) + "\n", encoding="utf-8")
          (out / "README-IMPORT.txt").write_text(
              "Импортируйте TMNT.tmnt.zip через лаунчер TMNT. Отдельный tmnt_code.so не является пакетом для импорта.\n"
              "Этот артефакт содержит файлы, полученные из игры, и доступен публично; хранится ограниченное время.\n",
              encoding="utf-8",
          )
          PY

      - name: Remove raw game and translated intermediates
        if: always()
        run: |
          rm -rf build/android-game-source/game build/android-game-source/source.zip recomp/out

      - name: Upload importable game pack (PUBLIC, short retention)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TMNT-2003-game-pack-PUBLIC
          path: |
            build/android-game-artifacts/TMNT.tmnt.zip
            build/android-game-artifacts/tmnt_code.so
            build/android-game-artifacts/image.bin
            build/android-game-artifacts/SHA256SUMS.txt
            build/android-game-artifacts/BUILD-INFO.txt
            build/android-game-artifacts/README-IMPORT.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
