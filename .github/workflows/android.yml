name: Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - ".github/workflows/android.yml"
      - ".github/workflows/android-game-pack.yml"
      - ".github/workflows/android-private-apk.yml"
      - "android/**"
      - "rt/**"
      - "tools/android/**"
      - "tools/make_android_files.py"
      - "tools/make_vita_files.py"
      - "tools/vita_code/requirements.txt"
      - "recomp/**"
      - "Makefile"
      - "LICENSE"
      - "README.md"
      - "docs/ANDROID.md"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - ".github/workflows/android-game-pack.yml"
      - ".github/workflows/android-private-apk.yml"
      - "android/**"
      - "rt/**"
      - "tools/android/**"
      - "tools/make_android_files.py"
      - "tools/make_vita_files.py"
      - "tools/vita_code/requirements.txt"
      - "recomp/**"
      - "Makefile"
      - "LICENSE"
      - "README.md"
      - "docs/ANDROID.md"
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "Optional: direct HTTPS ZIP URL of the installed PC game (EXE + data). Leave empty when using exe_url."
        required: false
        default: ""
        type: string
      exe_url:
        description: "Optional: direct HTTPS URL to TMNT_EN.EXE only (~2.15 MiB), or a ZIP containing only that EXE. Requires private_apk; media stays on the phone."
        required: false
        default: ""
        type: string
      confirm_public_artifact:
        description: "Public repositories only: I understand the game-derived artifact (game pack or embedded APK) will be PUBLICLY downloadable"
        required: false
        default: false
        type: boolean
      private_apk:
        description: "With game_zip_url or exe_url: build an APK with embedded code/image (no full media data). Public repo also needs confirm_public_artifact."
        required: false
        default: false
        type: boolean
      target_abi:
        description: "CPU ABI for URL builds; push/PR builds both ABIs"
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: android-35
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: 8.11.1
  AGP_VERSION: 8.9.2

jobs:
  dispatch-inputs:
    name: Validate manual inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check source selection
        env:
          GAME_ZIP_URL: ${{ inputs.game_zip_url }}
          EXE_URL: ${{ inputs.exe_url }}
          PRIVATE_APK: ${{ inputs.private_apk }}
        run: |
          python3 - <<'PY'
          import os
          game = bool(os.environ.get("GAME_ZIP_URL", "").strip())
          exe = bool(os.environ.get("EXE_URL", "").strip())
          private = os.environ.get("PRIVATE_APK", "false") == "true"
          if game and exe:
              raise SystemExit("::error::Fill only one source: game_zip_url or exe_url, not both.")
          if exe and not private:
              raise SystemExit("::error::exe_url is only for embedded APK builds; enable private_apk.")
          if private and not game and not exe:
              raise SystemExit("::error::private_apk needs game_zip_url or exe_url.")
          print("Manual inputs are valid.")
          PY

  build:
    name: Build and verify APK (${{ matrix.abi }})
    if: github.event_name != 'workflow_dispatch' || ((inputs.game_zip_url == null || inputs.game_zip_url == '') && (inputs.exe_url == null || inputs.exe_url == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install translator dependencies
        run: python -m pip install -r tools/vita_code/requirements.txt

      - name: Host tests
        run: |
          python -m py_compile \
            tools/android/fetch_deps.py \
            tools/android/fetch_game_zip.py \
            tools/android/embedded_game.py \
            tools/android/build_private_apk.py \
            tools/android/verify_apk.py \
            tools/android/verify_game_pack.py \
            tools/android/test_android.py \
            tools/android/test_game_zip.py \
            tools/android/test_embedded.py \
            tools/make_android_files.py
          python tools/android/test_android.py
          python tools/android/test_game_zip.py
          python tools/android/test_embedded.py
          mkdir -p build/ci
          cc -std=c11 -Wall -Wextra -Werror -I. tools/android/test_touch.c rt/android/touch.c -o build/ci/test_touch
          ./build/ci/test_touch

      - name: Fetch pinned native sources
        run: python tools/android/fetch_deps.py

      - name: Build APK
        working-directory: android
        run: |
          mkdir -p ../build/ci
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -PtmntAbi=${{ matrix.abi }} :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee ../build/ci/gradle-clean.log

      - name: Surface Gradle failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/ci/gradle-clean.log")
          if p.is_file():
              text = p.read_text(errors="replace")[-4000:]
              print("::error::Gradle failure tail%0A" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY

      - name: Verify APK and exercise game-pack ABI without game data
        run: python tools/android/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Android lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace -PtmntAbi=${{ matrix.abi }} :app:lintDebug

      - name: Exercise embedded packaging with synthetic hashed and EXE-only fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          sys.path.insert(0, "tools/android")
          import make_android_files as android
          import make_vita_files as vita
          import embedded_game as embedded
          import verify_apk as verify

          work = Path("build/ci/embedded-fixture")
          work.mkdir(parents=True, exist_ok=True)
          runtime = Path("build/android-runtime/${{ matrix.abi }}/libtmnt_runtime.so")
          clang = android.find_ndk(None)
          module = verify.synthetic_module(clang, runtime, work, soname="libtmnt_code.so", abi="${{ matrix.abi }}")
          image = work / "image.bin"
          image.write_bytes(b"synthetic-no-game-image" * 64)
          game = work / "game"
          game.mkdir(exist_ok=True)
          for source in vita.DATA_FILES:
              (game / source).write_bytes(("synthetic-no-game-data:" + source).encode() * 32)
          manifest = embedded.make_manifest(module, image, runtime, vita.EXE_SHA1, game, abi="${{ matrix.abi }}")
          embedded.write_directory(work / "input", module, image, manifest)
          PY
          cd android
          ./gradlew --no-daemon --stacktrace -PtmntAbi=${{ matrix.abi }} -PtmntEmbeddedDir="$GITHUB_WORKSPACE/build/ci/embedded-fixture/input" :app:testDebugUnitTest :app:assembleDebug
          cd ..
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import zipfile
          sys.path.insert(0, "tools")
          sys.path.insert(0, "tools/android")
          import make_android_files as android
          import make_vita_files as vita
          import embedded_game as embedded
          import verify_apk as verify

          work = Path("build/ci/embedded-fixture")
          apk = Path("build/android-private-app/outputs/apk/debug/app-debug.apk")
          packaged = work / "libtmnt_runtime.packaged.so"
          with zipfile.ZipFile(apk) as z, packaged.open("wb") as out:
              with z.open("lib/${{ matrix.abi }}/libtmnt_runtime.so") as src:
                  shutil.copyfileobj(src, out, 1 << 20)
          clang = android.find_ndk(None)
          relink = work / "relink"
          relink.mkdir(exist_ok=True)
          module = verify.synthetic_module(clang, packaged, relink, soname="libtmnt_code.so", abi="${{ matrix.abi }}")
          manifest = embedded.make_manifest(module, work / "image.bin", packaged, vita.EXE_SHA1, work / "game", abi="${{ matrix.abi }}")
          embedded.write_directory(work / "input", module, work / "image.bin", manifest)
          PY
          cd android
          ./gradlew --no-daemon --stacktrace -PtmntAbi=${{ matrix.abi }} -PtmntEmbeddedDir="$GITHUB_WORKSPACE/build/ci/embedded-fixture/input" :app:assembleDebug
          cd ..
          python tools/android/verify_apk.py build/android-private-app/outputs/apk/debug/app-debug.apk
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          sys.path.insert(0, "tools/android")
          import make_vita_files as vita
          import embedded_game as embedded

          work = Path("build/ci/embedded-fixture")
          module = work / "relink" / "libtmnt_code.so"
          packaged = work / "libtmnt_runtime.packaged.so"
          manifest = embedded.make_manifest(module, work / "image.bin", packaged, vita.EXE_SHA1, None,
                                            abi="${{ matrix.abi }}", defer_data=True)
          embedded.write_directory(work / "input", module, work / "image.bin", manifest)
          PY
          cd android
          ./gradlew --no-daemon --stacktrace -PtmntAbi=${{ matrix.abi }} -PtmntEmbeddedDir="$GITHUB_WORKSPACE/build/ci/embedded-fixture/input" :app:assembleDebug
          cd ..
          python tools/android/verify_apk.py build/android-private-app/outputs/apk/debug/app-debug.apk

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p build/ci-artifacts
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build/ci-artifacts/TMNT-2003-android-debug.apk
            sha256sum build/ci-artifacts/TMNT-2003-android-debug.apk > build/ci-artifacts/SHA256SUMS.txt
          fi
          if [ -f build/android-runtime/${{ matrix.abi }}/libtmnt_runtime.so ]; then
            cp build/android-runtime/${{ matrix.abi }}/libtmnt_runtime.so build/ci-artifacts/libtmnt_runtime.so
          fi
          if [ -f build/ci/synthetic-pack.tmnt.zip ]; then
            cp build/ci/synthetic-pack.tmnt.zip build/ci-artifacts/synthetic-pack-NO-GAME-DATA.tmnt.zip
          fi

      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TMNT-2003-android-debug-apk-${{ matrix.abi }}
          path: |
            build/ci-artifacts/TMNT-2003-android-debug.apk
            build/ci-artifacts/SHA256SUMS.txt
            build/ci-artifacts/libtmnt_runtime.so
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload reports and synthetic pack fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-reports-${{ matrix.abi }}
          path: |
            android/app/build/reports/**
            build/android-private-app/reports/**
            build/ci-artifacts/synthetic-pack-NO-GAME-DATA.tmnt.zip
          if-no-files-found: warn
          retention-days: 7

  game-pack:
    name: Build public game pack from URL
    if: github.event_name == 'workflow_dispatch' && inputs.game_zip_url != null && inputs.game_zip_url != '' && (inputs.exe_url == null || inputs.exe_url == '') && !inputs.private_apk
    uses: ./.github/workflows/android-game-pack.yml
    with:
      game_zip_url: ${{ inputs.game_zip_url }}
      target_abi: ${{ inputs.target_abi }}
      confirm_public_artifact: ${{ inputs.confirm_public_artifact == true || inputs.confirm_public_artifact == 'true' }}

  private-apk:
    name: Build embedded APK from URL
    if: github.event_name == 'workflow_dispatch' && inputs.private_apk && ((inputs.game_zip_url != null && inputs.game_zip_url != '' && (inputs.exe_url == null || inputs.exe_url == '')) || (inputs.exe_url != null && inputs.exe_url != '' && (inputs.game_zip_url == null || inputs.game_zip_url == '')))
    uses: ./.github/workflows/android-private-apk.yml
    with:
      game_zip_url: ${{ inputs.game_zip_url }}
      exe_url: ${{ inputs.exe_url }}
      target_abi: ${{ inputs.target_abi }}
      confirm_public_artifact: ${{ inputs.confirm_public_artifact == true || inputs.confirm_public_artifact == 'true' }}
