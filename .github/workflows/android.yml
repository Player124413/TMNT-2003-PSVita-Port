name: Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "rt/**"
      - "tools/android/**"
      - "tools/make_android_files.py"
      - "tools/make_vita_files.py"
      - "tools/vita_code/requirements.txt"
      - "recomp/**"
      - "Makefile"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "rt/**"
      - "tools/android/**"
      - "tools/make_android_files.py"
      - "tools/make_vita_files.py"
      - "tools/vita_code/requirements.txt"
      - "recomp/**"
      - "Makefile"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_ABI: armeabi-v7a
  ANDROID_PLATFORM: android-35
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: 8.11.1
  AGP_VERSION: 8.9.2

jobs:
  build:
    name: Build and verify APK (no game data)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install translator dependencies
        run: python -m pip install -r tools/vita_code/requirements.txt

      - name: Host tests
        run: |
          python -m py_compile tools/android/fetch_deps.py tools/android/test_android.py tools/make_android_files.py
          python tools/android/test_android.py
          mkdir -p build/ci
          cc -std=c11 -Wall -Wextra -Werror -I. tools/android/test_touch.c rt/android/touch.c -o build/ci/test_touch
          ./build/ci/test_touch

      - name: Fetch pinned native sources
        run: python tools/android/fetch_deps.py

      - name: Build APK and run lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Verify APK and exercise game-pack ABI without game data
        run: python tools/android/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p build/ci-artifacts
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build/ci-artifacts/TMNT-2003-android-debug.apk
            sha256sum build/ci-artifacts/TMNT-2003-android-debug.apk > build/ci-artifacts/SHA256SUMS.txt
          fi
          if [ -f build/android-runtime/armeabi-v7a/libtmnt_runtime.so ]; then
            cp build/android-runtime/armeabi-v7a/libtmnt_runtime.so build/ci-artifacts/libtmnt_runtime.so
          fi
          if [ -f build/ci/synthetic-pack.tmnt.zip ]; then
            cp build/ci/synthetic-pack.tmnt.zip build/ci-artifacts/synthetic-pack-NO-GAME-DATA.tmnt.zip
          fi

      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TMNT-2003-android-debug-apk
          path: |
            build/ci-artifacts/TMNT-2003-android-debug.apk
            build/ci-artifacts/SHA256SUMS.txt
            build/ci-artifacts/libtmnt_runtime.so
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload reports and synthetic pack fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            build/ci-artifacts/synthetic-pack-NO-GAME-DATA.tmnt.zip
          if-no-files-found: warn
          retention-days: 7
